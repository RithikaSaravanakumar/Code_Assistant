{% extends "base.html" %}

{% block title %}{{ 'Edit' if question else 'Add' }} MCQ Question - ZeCode{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 600px;">
    <h2 class="form-title">{{ 'Edit' if question else 'Add New' }} MCQ Question</h2>
    <p class="form-subtitle" style="margin-bottom: 24px;">Configure multiple-choice details below</p>
    
    <form action="{{ url_for('edit_question', question_id=question.id) if question else url_for('add_mcq') }}" method="POST">
        <div class="form-group">
            <label for="question_text" class="form-label">Question Prompt</label>
            <textarea id="question_text" name="question_text" class="form-control" rows="4" placeholder="Type the question prompt here..." required>{{ question.question_text if question else '' }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="option_a" class="form-label">Option A</label>
            <input type="text" id="option_a" name="option_a" class="form-control" placeholder="Option A value" value="{{ question.option_a if question else '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="option_b" class="form-label">Option B</label>
            <input type="text" id="option_b" name="option_b" class="form-control" placeholder="Option B value" value="{{ question.option_b if question else '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="option_c" class="form-label">Option C</label>
            <input type="text" id="option_c" name="option_c" class="form-control" placeholder="Option C value" value="{{ question.option_c if question else '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="option_d" class="form-label">Option D</label>
            <input type="text" id="option_d" name="option_d" class="form-control" placeholder="Option D value" value="{{ question.option_d if question else '' }}" required>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label for="correct_answer" class="form-label">Correct Option</label>
                <select id="correct_answer" name="correct_answer" class="form-control" required>
                    <option value="" disabled {{ 'selected' if not question }}>Select Option</option>
                    <option value="A" {{ 'selected' if question and question.correct_answer == 'A' }}>A</option>
                    <option value="B" {{ 'selected' if question and question.correct_answer == 'B' }}>B</option>
                    <option value="C" {{ 'selected' if question and question.correct_answer == 'C' }}>C</option>
                    <option value="D" {{ 'selected' if question and question.correct_answer == 'D' }}>D</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="marks" class="form-label">Marks / Score Points</label>
                <input type="number" id="marks" name="marks" class="form-control" min="1" max="100" value="{{ question.marks if question else '1' }}" required>
            </div>
        </div>
        
        <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">Save Question</button>
            <a href="/admin/dashboard" class="btn btn-secondary" style="flex: 1;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
