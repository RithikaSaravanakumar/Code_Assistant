{% extends "base.html" %}

{% block title %}Sign In - ZeCode{% endblock %}

{% block content %}
<div class="form-card">
    <h2 class="form-title">Welcome Back</h2>
    <p class="form-subtitle">Sign in to resume your assessments</p>
    
    <form action="/login" method="POST">
        <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="e.g., john@example.com" required>
        </div>
        
        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">Sign In</button>
    </form>
    
    <div class="form-footer">
        Don't have an account? <a href="/register">Register</a>
    </div>
</div>
{% endblock %}
